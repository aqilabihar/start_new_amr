amcl:
  ros__parameters:
    use_sim_time: true
    odom_frame_id: odom
    base_frame_id: base_link
    global_frame_id: map
    scan_topic: /scan
    min_particles: 500
    max_particles: 2000
    laser_model_type: likelihood_field
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    laser_max_range: 12.0
    laser_min_range: 0.3
    update_min_d: 0.2
    update_min_a: 0.1
    resample_interval: 1
    save_pose_rate: 0.5
    tf_broadcast: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    default_behavior_tree: "navigate_to_pose_w_replanning_and_recovery.xml"
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_dwb_controller::DWBController"
      max_vel_x: 0.5
      min_vel_x: -0.2
      max_vel_theta: 1.0
      min_vel_theta: -1.0
      acc_lim_x: 1.0
      acc_lim_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.0
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.35
      latch_xy_goal_tolerance: false
      heading_lookahead: 0.325

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      width: 4.0
      height: 4.0
      resolution: 0.05
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          obstacle_range: 2.5
          raytrace_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      width: 10.0
      height: 10.0
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          obstacle_range: 2.5
          raytrace_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names: ["map_server", "amcl", "planner_server", "controller_server", "bt_navigator"]
